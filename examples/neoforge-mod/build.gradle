plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.1.39' apply false
    id 'net.neoforged.moddev.legacyforge' version '2.0.91' apply false
    id 'maven-publish'
}

def legacyNeoForge = project.minecraft_version.toString() == '1.20.1'
apply plugin: (legacyNeoForge
        ? 'net.neoforged.moddev.legacyforge'
        : 'net.neoforged.gradle.userdev')

version = project.mod_version
group = project.maven_group

base { archivesName = "${project.archives_base_name}-${project.minecraft_version}" }

sourceSets.main.java.srcDir('../common-support/src/main/java')
def eventBasedInputVersions = ['1.21.9', '1.21.10']
def renamedIdentifierVersions = ['1.21.11']
def separateClientInputVersions = ['1.20.2']
def legacyTickEventVersions = ['1.20.3', '1.20.4']
def inputSourceDir = renamedIdentifierVersions.contains(project.minecraft_version.toString())
        ? 'src/input-identifier/java'
        : (eventBasedInputVersions.contains(project.minecraft_version.toString())
            ? 'src/input-events/java'
            : (separateClientInputVersions.contains(project.minecraft_version.toString())
                ? 'src/input-20.2/java'
                : (legacyTickEventVersions.contains(project.minecraft_version.toString())
                    ? 'src/input-20.3-20.4/java'
                    : 'src/input-legacy/java')))
sourceSets.main.java.srcDir(legacyNeoForge ? '../forge-mod/src/input-legacy/java' : inputSourceDir)

repositories { mavenCentral() }

sourceSets.main.resources.srcDir('../../examples/fabric-mod/src/main/resources/assets')
if (legacyNeoForge) {
    sourceSets.main.resources.srcDir('src/legacy-forge/resources')
    sourceSets.main.resources.exclude('META-INF/neoforge.mods.toml')
    legacyForge {
        enable {
            neoForgeVersion = project.neoforge_version
            runs {
                client { client() }
            }
            mods {
                lolomc_gui_example { sourceSet sourceSets.main }
            }
        }
    }
}

dependencies {
    if (!legacyNeoForge) {
        def neoForgeArtifact = project.findProperty('neoforge_artifact') ?: 'neoforge'
        implementation "net.neoforged:${neoForgeArtifact}:${project.neoforge_version}"
    }
    implementation "dev.lolomc:lolomc-gui:${project.lolomc_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.release = project.java_version.toInteger()
    options.encoding = 'UTF-8'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(project.java_version.toInteger())
    sourceCompatibility = JavaVersion.toVersion(project.java_version)
    targetCompatibility = JavaVersion.toVersion(project.java_version)
    withSourcesJar()
}

jar {
    from('../../LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } }
}

processResources {
    def neoForgeVersionRange = project.neoforge_version_range.toString().startsWith('[')
        ? project.neoforge_version_range.toString()
        : "[${project.neoforge_version_range},)"
    inputs.properties([version: project.version, minecraft_version: project.minecraft_version,
                       neoforge_version_range: neoForgeVersionRange])
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(version: project.version, minecraft_version: project.minecraft_version,
               neoforge_version_range: neoForgeVersionRange)
    }
    if (legacyNeoForge) {
        def forgeVersionRange = project.neoforge_version_range.toString().startsWith('[')
            ? project.neoforge_version_range.toString()
            : "[${project.neoforge_version_range},)"
        inputs.properties([version: project.version, minecraft_version: project.minecraft_version,
                           forge_version_range: forgeVersionRange])
        filesMatching('META-INF/mods.toml') {
            expand(version: project.version, minecraft_version: project.minecraft_version,
                   forge_version_range: forgeVersionRange)
        }
    }
}

publishing {
    publications { mavenJava(MavenPublication) { from components.java } }
}
