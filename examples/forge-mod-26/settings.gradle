pluginManagement {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'lolomc-gui-forge-26-example'

includeBuild('../../runtime-java') {
    dependencySubstitution {
        substitute module('dev.lolomc:lolomc-gui') using project(':')
    }
}
