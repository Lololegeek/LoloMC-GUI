plugins {
    id 'java'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[7.0.29,8.0)'
}

version = project.mod_version
group = project.maven_group

base { archivesName = "${project.archives_base_name}-${project.minecraft_version}" }

java.toolchain.languageVersion = JavaLanguageVersion.of(project.java_version.toInteger())

minecraft {
    mappings channel: 'official', version: project.minecraft_version
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods { lolomc_gui_example { source sourceSets.main } }
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}")
    implementation "dev.lolomc:lolomc-gui:${project.lolomc_version}"
}

sourceSets.main.java.srcDir('../forge-mod/src/main/java')
sourceSets.main.java.srcDir('../common-support/src/main/java')
sourceSets.main.resources.srcDir('../forge-mod/src/main/resources')
sourceSets.main.resources.srcDir('../fabric-mod/src/main/resources/assets')

tasks.withType(JavaCompile).configureEach {
    options.release = project.java_version.toInteger()
    options.encoding = 'UTF-8'
}

processResources {
    inputs.properties([version: project.version, minecraft_version: project.minecraft_version])
    filesMatching('META-INF/mods.toml') {
        expand(version: project.version, minecraft_version: project.minecraft_version)
    }
}

jar {
    archiveClassifier = ''
    from('../../LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } }
}

publishing {
    publications { mavenJava(MavenPublication) { from components.java } }
}
